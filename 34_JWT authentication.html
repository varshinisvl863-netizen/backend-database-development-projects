<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Authentication</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#message{
    margin-top:15px;
    padding:10px;
    background:#f8f9fa;
    border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
    <h2>JWT Authentication</h2>

    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <div id="message">Login status will appear here.</div>
</div>

<script>
function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    fetch("http://localhost:3000/api/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            email:email,
            password:password
        })
    })
    .then(response => response.json())
    .then(data => {

        if(data.token){
            localStorage.setItem("jwtToken", data.token);

            document.getElementById("message").innerHTML =
            "Login Successful! JWT Token Stored.";
        }else{
            document.getElementById("message").innerHTML =
            "Invalid Credentials";
        }

    })
    .catch(error => {
        document.getElementById("message").innerHTML =
        "Server Connection Error";
    });
}
</script>

</body>
</html>
