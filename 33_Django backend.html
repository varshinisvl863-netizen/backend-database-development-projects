<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Django Backend System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#0c4b33;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#083624;
}

#output{
    margin-top:20px;
    padding:10px;
    background:#f8f9fa;
    border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
    <h2>Django Backend System</h2>

    <input type="text" id="fullname" placeholder="Enter Full Name">

    <button onclick="submitData()">Submit</button>

    <div id="output">Django API response will appear here.</div>
</div>

<script>
function submitData(){

    let fullname = document.getElementById("fullname").value;

    fetch("http://127.0.0.1:8000/api/users/",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            fullname:fullname
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("output").innerHTML =
        "<strong>Response:</strong> " + JSON.stringify(data);
    })
    .catch(error => {
        document.getElementById("output").innerHTML =
        "Error connecting to Django Backend";
    });

}
</script>

</body>
</html>
