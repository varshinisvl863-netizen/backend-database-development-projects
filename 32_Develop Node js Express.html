<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node.js Express Backend Client</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

#result{
    margin-top:20px;
    padding:10px;
    background:#f8f9fa;
    border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
    <h2>Express API Client</h2>

    <input type="text" id="username" placeholder="Enter Username">

    <button onclick="sendData()">Send Request</button>

    <div id="result">Server response will appear here.</div>
</div>

<script>
function sendData(){

    let username = document.getElementById("username").value;

    fetch("http://localhost:3000/api/users",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:username
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML =
        "<strong>Response:</strong> " + JSON.stringify(data);
    })
    .catch(error => {
        document.getElementById("result").innerHTML =
        "Error connecting to Express Backend";
    });

}
</script>

</body>
</html>
